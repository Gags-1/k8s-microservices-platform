name: CI - Test and Publish Microservices

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-product-service:
    name: Test Product Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/product-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r services/product-service/requirements.txt

      - name: Run Product Service tests
        working-directory: services/product-service
        run: python -m pytest -v tests/

  test-order-service:
    name: Test Order Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/order-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r services/order-service/requirements.txt

      - name: Run Order Service tests
        working-directory: services/order-service
        run: python -m pytest -v tests/

  build-and-push:
    name: Build and Publish Images
    runs-on: ubuntu-latest
    needs:
      - test-product-service
      - test-order-service
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image names and tags
        id: meta
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"

          echo "product_image=ghcr.io/${OWNER}/${REPO}-product-service" >> "$GITHUB_OUTPUT"
          echo "order_image=ghcr.io/${OWNER}/${REPO}-order-service" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push Product Service image
        uses: docker/build-push-action@v6
        with:
          context: ./services/product-service
          push: true
          tags: |
            ${{ steps.meta.outputs.product_image }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.product_image }}:latest
          cache-from: type=gha,scope=product-service
          cache-to: type=gha,mode=max,scope=product-service

      - name: Build and push Order Service image
        uses: docker/build-push-action@v6
        with:
          context: ./services/order-service
          push: true
          tags: |
            ${{ steps.meta.outputs.order_image }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.order_image }}:latest
          cache-from: type=gha,scope=order-service
          cache-to: type=gha,mode=max,scope=order-service
