services:
  product-service:
    build:
      context: ./services/product-service
    ports:
      - "8001:8000"
    restart: unless-stopped

  order-service:
    build:
      context: ./services/order-service
    ports:
      - "8002:8000"
    environment:
      PRODUCT_SERVICE_URL: http://product-service:8000/products/1
    depends_on:
      - product-service
    restart: unless-stopped
