global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: product-service
    metrics_path: /metrics/
    static_configs:
      - targets: ["product-service.microservices.svc.cluster.local:8000"]

  - job_name: order-service
    metrics_path: /metrics/
    static_configs:
      - targets: ["order-service.microservices.svc.cluster.local:8000"]
